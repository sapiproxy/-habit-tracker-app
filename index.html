<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamified Habit Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg: #121316;
            --card-bg: #1e2025;
            --border: #2e323b;
            --text-main: #f0f2f5;
            --text-muted: #8b92a0;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --table-header: #262930;
            --row-alt: #181a1e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 20px;
            font-size: 13px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .header-bar h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        select {
            background: var(--bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 4px;
            outline: none;
        }

        .analytics-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }

        .card-title {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .stats-container {
            display: flex;
            gap: 16px;
            align-items: center;
            height: 160px;
        }

        .stat-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--bg);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .stat-val {
            font-size: 20px;
            font-weight: 700;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
        }

        .chart-container {
            flex: 1;
            height: 140px;
            position: relative;
        }

        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
            text-align: center;
        }

        th,
        td {
            border: 1px solid var(--border);
            padding: 6px 8px;
            font-size: 11px;
        }

        th {
            background: var(--table-header);
            color: var(--text-muted);
            font-weight: 600;
        }

        td.habit-name {
            text-align: left;
            font-weight: 600;
            min-width: 170px;
            background: var(--card-bg);
        }

        input[type="checkbox"] {
            cursor: pointer;
            accent-color: var(--accent);
            width: 14px;
            height: 14px;
        }

        .bar-cell {
            width: 100px;
        }

        .progress-bar-bg {
            background: var(--bg);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        .top-habits-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .top-habit-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 10px;
            background: var(--bg);
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid var(--border);
        }

        .action-btn,
        .primary-btn,
        .secondary-btn,
        .mini-btn {
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s ease;
            font-weight: 600;
        }

        .action-btn,
        .primary-btn {
            background: var(--accent);
            color: white;
            padding: 8px 14px;
        }

        .action-btn:hover,
        .primary-btn:hover {
            background: var(--accent-hover);
        }

        .secondary-btn {
            background: transparent;
            color: var(--text-main);
            padding: 8px 12px;
        }

        .mini-btn {
            background: transparent;
            color: var(--text-main);
            padding: 6px 8px;
            font-size: 11px;
        }

        .mini-btn.danger {
            border-color: rgba(239, 68, 68, 0.6);
            color: #fca5a5;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-window {
            width: min(440px, 100%);
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .modal-header h3 {
            font-size: 16px;
        }

        .close-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
        }

        .habit-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
            margin-bottom: 16px;
        }

        .habit-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .habit-row input {
            flex: 1;
            background: var(--bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
        }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
    </style>
</head>

<body>
    <div class="header-bar">
        <h1>HABIT & STUDY TRACKER</h1>
        <div class="controls">
            <div> <label>Year: </label> <select id="yearSelect">
                    <option>2026</option>
                </select> </div>
            <div> <label>Month: </label> <select id="monthSelect">
                    <option>March</option>
                </select> </div>
            <button class="action-btn" id="manageHabitsBtn">Manage Habits</button>
        </div>
    </div>
    <div class="analytics-grid">
        <div class="card">
            <div class="card-title">Daily Progress</div>
            <div style="height: 160px;"> <canvas id="dailyBarChart"></canvas> </div>
        </div>
        <div class="card">
            <div class="card-title">Completion Overview</div>
            <div class="stats-container">
                <div class="chart-container"> <canvas id="donutChart"></canvas> </div>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <div class="stat-box"> <span class="stat-val" id="totalChecks">0</span> <span
                            class="stat-label">Done</span> </div>
                    <div class="stat-box"> <span class="stat-val" id="remainingChecks">0</span> <span
                            class="stat-label">Left</span> </div>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card-title">Top Habits</div>
            <ul class="top-habits-list" id="topHabitsList"></ul>
        </div>
    </div>
    <div class="table-container">
        <table id="trackerTable">
            <thead>
                <tr id="weekHeader"></tr>
                <tr id="dayHeader"></tr>
            </thead>
            <tbody id="trackerBody"></tbody>
        </table>
    </div>
    <div class="modal-overlay" id="habitModal">
        <div class="modal-window">
            <div class="modal-header">
                <h3>Manage Habits</h3>
                <button class="close-btn" id="closeHabitModal" type="button">×</button>
            </div>
            <div class="habit-list" id="habitList"></div>
            <div class="modal-actions">
                <button class="secondary-btn" id="addHabitBtn" type="button">+ Add Habit</button>
                <button class="primary-btn" id="saveHabitsBtn" type="button">Save</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDwGdf_wsOwY70tHpqptdz_fokGCcgjYUs",
            authDomain: "habit-tracker-app-ab0a5.firebaseapp.com",
            projectId: "habit-tracker-app-ab0a5",
            storageBucket: "habit-tracker-app-ab0a5.firebasestorage.app",
            messagingSenderId: "872622518038",
            appId: "1:872622518038:web:da49afab2cb40b5119ea37"
        };

        const hasFirebaseConfig = Object.values(firebaseConfig).every(value => value && !value.includes('YOUR_'));
        let db = null;

        if (hasFirebaseConfig) {
            try {
                const app = firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
            } catch (error) {
                console.warn('Firebase init failed, using local storage fallback:', error);
            }
        }

        let habits = [
            "Wake up at 05:00",
            "Gym & Workout",
            "Reading / Learning",
            "Day Planning",
            "Deep Work / Project",
            "Social Media Detox",
            "Journaling",
            "Cold Shower",
            "10k Steps"
        ];
        const totalDays = 31;
        let trackerData = habits.map(() => Array(totalDays).fill(false));

        function saveLocalData() {
            localStorage.setItem('habitTrackerData', JSON.stringify({ habits, trackerData }));
        }

        function loadLocalData() {
            try {
                const saved = JSON.parse(localStorage.getItem('habitTrackerData'));
                if (saved && Array.isArray(saved.habits) && Array.isArray(saved.trackerData)) {
                    habits = saved.habits;
                    trackerData = saved.trackerData.map(row => Array.isArray(row) ? row : Array(totalDays).fill(false));
                }
            } catch (error) {
                console.warn('Could not load local data:', error);
            }
        }

        async function loadDataFromFirebase() {
            if (!db) return false;

            try {
                const snapshot = await db.collection('habitTracker').doc('main').get();
                if (!snapshot.exists) return false;

                const data = snapshot.data();
                if (!data || !Array.isArray(data.habits) || !Array.isArray(data.trackerData)) return false;

                habits = data.habits;
                trackerData = data.trackerData.map(row => Array.isArray(row) ? row : Array(totalDays).fill(false));
                saveLocalData();
                return true;
            } catch (error) {
                console.warn('Firebase load failed, using local data:', error);
                return false;
            }
        }

        async function saveDataToFirebase() {
            if (!db) {
                saveLocalData();
                return;
            }

            try {
                await db.collection('habitTracker').doc('main').set({ habits, trackerData }, { merge: true });
                saveLocalData();
            } catch (error) {
                console.warn('Firebase save failed, storing locally instead:', error);
                saveLocalData();
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function renderHabitModal() {
            const habitList = document.getElementById('habitList');
            habitList.innerHTML = habits.map((habit, idx) => `
                <div class="habit-row">
                    <input class="habit-input" data-index="${idx}" type="text" value="${escapeHtml(habit)}" aria-label="Habit name ${idx + 1}">
                    <button class="mini-btn danger" data-delete-index="${idx}" type="button">Delete</button>
                </div>
            `).join('');
        }

        function openHabitModal() {
            renderHabitModal();
            document.getElementById('habitModal').classList.add('show');
        }

        function closeHabitModal() {
            document.getElementById('habitModal').classList.remove('show');
        }

        function addHabitRow() {
            habits.push('New Habit');
            trackerData.push(Array(totalDays).fill(false));
            renderHabitModal();
        }

        function saveHabits() {
            const inputs = [...document.querySelectorAll('.habit-input')];
            const nextHabits = [];
            const nextData = [];

            inputs.forEach((input) => {
                const value = input.value.trim();
                if (!value) return;

                const originalIndex = Number(input.dataset.index);
                const existingRow = trackerData[originalIndex] || Array(totalDays).fill(false);
                nextHabits.push(value);
                nextData.push(Array.from({ length: totalDays }, (_, idx) => !!existingRow[idx]));
            });

            habits = nextHabits;
            trackerData = nextData;

            renderTable();
            updateDashboard();
            saveDataToFirebase();
            closeHabitModal();
        }

        function initTable() {
            const weekHeader = document.getElementById('weekHeader');
            const dayHeader = document.getElementById('dayHeader');
            const tbody = document.getElementById('trackerBody');

            let weekHtml = '<th rowspan="2" style="width: 170px;">My Habits</th>';
            for (let i = 1; i <= 4; i++) {
                const span = i === 4 ? 10 : 7;
                weekHtml += `<th colspan="${span}">Week ${i}</th>`;
            }
            weekHtml += '<th rowspan="2">Goal</th><th rowspan="2">Done</th><th rowspan="2">Left</th><th rowspan="2">%</th><th rowspan="2">Progress</th>';

            let dayHtml = '';
            for (let i = 1; i <= totalDays; i++) {
                dayHtml += `<th>${i}</th>`;
            }

            weekHeader.innerHTML = weekHtml;
            dayHeader.innerHTML = dayHtml;

            tbody.innerHTML = habits.map((habit, rIdx) => `
                <tr>
                    <td class="habit-name">${habit}</td>
                    ${Array.from({ length: totalDays }, (_, dIdx) => `
                        <td>
                            <input type="checkbox" onchange="toggleCheck(${rIdx}, ${dIdx})" ${trackerData[rIdx] && trackerData[rIdx][dIdx] ? 'checked' : ''}>
                        </td>
                    `).join('')}
                    <td id="goal-${rIdx}">${totalDays}</td>
                    <td id="done-${rIdx}">0</td>
                    <td id="left-${rIdx}">${totalDays}</td>
                    <td id="pct-${rIdx}">0%</td>
                    <td class="bar-cell">
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" id="bar-${rIdx}"></div>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function renderTable() {
            initTable();
        }

        let barChart, donutChart;

        function initCharts() {
            const barCtx = document.getElementById('dailyBarChart').getContext('2d');
            barChart = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: Array.from({ length: totalDays }, (_, i) => i + 1),
                    datasets: [{
                        data: Array(totalDays).fill(0),
                        backgroundColor: '#3b82f6',
                        borderRadius: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { color: '#8b92a0', font: { size: 9 } }
                        },
                        y: {
                            max: habits.length,
                            grid: { color: '#2e323b' },
                            ticks: { color: '#8b92a0', stepSize: 2 }
                        }
                    }
                }
            });

            const donutCtx = document.getElementById('donutChart').getContext('2d');
            donutChart = new Chart(donutCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Completed', 'Remaining'],
                    datasets: [{
                        data: [0, habits.length * totalDays],
                        backgroundColor: ['#3b82f6', '#262930'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%',
                    plugins: { legend: { display: false } }
                }
            });
        }

        function toggleCheck(row, day) {
            if (!trackerData[row]) {
                trackerData[row] = Array(totalDays).fill(false);
            }
            trackerData[row][day] = !trackerData[row][day];
            updateDashboard();
            saveDataToFirebase();
        }

        function updateDashboard() {
            let totalCompleted = 0;
            const totalPossible = habits.length * totalDays;
            const dayTotals = Array(totalDays).fill(0);
            const habitScores = [];

            habits.forEach((habit, rIdx) => {
                let done = 0;
                const habitRow = trackerData[rIdx] || Array(totalDays).fill(false);

                habitRow.forEach((checked, dIdx) => {
                    if (checked) {
                        done++;
                        dayTotals[dIdx]++;
                    }
                });

                totalCompleted += done;
                const left = totalDays - done;
                const pct = Math.round((done / totalDays) * 100);

                const doneEl = document.getElementById(`done-${rIdx}`);
                const leftEl = document.getElementById(`left-${rIdx}`);
                const pctEl = document.getElementById(`pct-${rIdx}`);
                const barEl = document.getElementById(`bar-${rIdx}`);

                if (doneEl) doneEl.textContent = done;
                if (leftEl) leftEl.textContent = left;
                if (pctEl) pctEl.textContent = `${pct}%`;
                if (barEl) barEl.style.width = `${pct}%`;

                habitScores.push({ name: habit, pct });
            });

            document.getElementById('totalChecks').textContent = totalCompleted;
            document.getElementById('remainingChecks').textContent = totalPossible - totalCompleted;

            if (barChart && donutChart) {
                barChart.data.datasets[0].data = dayTotals;
                barChart.update();

                donutChart.data.datasets[0].data = [totalCompleted, totalPossible - totalCompleted];
                donutChart.update();
            }

            habitScores.sort((a, b) => b.pct - a.pct);
            const topList = document.getElementById('topHabitsList');
            topList.innerHTML = habitScores.slice(0, 4).map(h => `
                <li class="top-habit-item">
                    <span>${h.name}</span>
                    <span style="font-weight: 700; color: var(--accent);">${h.pct}%</span>
                </li>
            `).join('');
        }

        document.getElementById('manageHabitsBtn').addEventListener('click', openHabitModal);
        document.getElementById('closeHabitModal').addEventListener('click', closeHabitModal);
        document.getElementById('addHabitBtn').addEventListener('click', addHabitRow);
        document.getElementById('saveHabitsBtn').addEventListener('click', saveHabits);

        document.getElementById('habitList').addEventListener('click', (event) => {
            const deleteBtn = event.target.closest('[data-delete-index]');
            if (!deleteBtn) return;

            const index = Number(deleteBtn.getAttribute('data-delete-index'));
            habits.splice(index, 1);
            trackerData.splice(index, 1);
            renderHabitModal();
        });

        async function initApp() {
            loadLocalData();

            if (hasFirebaseConfig) {
                await loadDataFromFirebase();
            }

            initTable();
            initCharts();
            updateDashboard();
        }

        initApp();
    </script>
</body>

</html>
